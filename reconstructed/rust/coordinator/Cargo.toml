[package]
name = "garlic-coordinator"
version = "0.9.2"
edition = "2021"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = {version="0.4",default-features=false,features=["std"]}
garlic-state = { path = "../state" }
garlic-relay-data = { path = "../relay-data" }
garlic-relay-session = { path = "../relay-session" }
getrandom = "0.3"
h2 = "0.4"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
ring = "0.17"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking","json","rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
tokio = { version = "1", features = ["fs","io-util","macros","net","rt-multi-thread","signal","sync","time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
