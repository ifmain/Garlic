[package]
name = "garlic-relay-session"
version = "0.9.2"
edition = "2021"

[dependencies]
base64 = "0.22"
ctrlc = { version = "3", features = ["termination"] }
garlic-relay-data = { path = "../relay-data" }
getrandom = "0.3"
ring = "0.17"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.29.0"
uuid = { version = "1", features = ["v4"] }
