[package]
name = "garlic-updates-android"
version = "0.9.2"
edition = "2021"

[lib]
name = "garlic_updates"
crate-type = ["cdylib"]

[dependencies]
release_cache = { package = "garlic-updates", path = ".." }
garlic-state = { path = "../../state" }
jni-sys = "=0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
