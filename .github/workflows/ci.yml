name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - name: Task exchange integration
        if: runner.os == 'Linux'
        run: python integration-tests/smoke.py
      - name: HTTP2 proxy integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install h2==4.4.1
          mkdir -p "$RUNNER_TEMP/caddy"
          cd "$RUNNER_TEMP/caddy"
          curl -fL https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz -o caddy_2.10.2_linux_amd64.tar.gz
          curl -fL https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_checksums.txt -o checksums.txt
          awk '$2 == "caddy_2.10.2_linux_amd64.tar.gz"' checksums.txt | sha512sum --check --strict -
          tar -xzf caddy_2.10.2_linux_amd64.tar.gz caddy
          cd "$GITHUB_WORKSPACE"
          CADDY="$RUNNER_TEMP/caddy/caddy" python integration-tests/proxy_h2.py
