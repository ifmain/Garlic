[package]
name = "garlic-client"
version = "0.9.2"
edition = "2021"

[lib]
name = "garlic_internal_network"
crate-type = ["rlib", "cdylib"]

[features]
alpha = []
jni-test = ["dep:jni-sys"]

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "=0.4.1"

[target.'cfg(windows)'.dependencies]
tproxy-config = "=7.0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Networking_WinSock"] }

[target.'cfg(any(target_os = "android", windows))'.dependencies]
tun = { version = "=0.8.14", features = ["async"] }
tun2proxy = { version = "=0.8.7", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util"] }

[[bin]]
name = "garlic-internal-network"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
jni-sys = { version = "=0.4.1", optional = true }
ctrlc = { version = "3", features=["termination"] }
garlic-client-logic = { path = "../client-logic" }
release_cache = { package = "garlic-updates", path = "../updates" }
garlic-relay-data = { path = "../relay-data" }
garlic-state = { path = "../state" }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking","json","rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std","ring","tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.29"
url = "2"
uuid = { version = "1", features = ["serde","v4"] }
webpki-roots = "1"

[target.'cfg(windows)'.dev-dependencies]
etherparse = "=0.20.3"
