[package]
name = "garlic-updates"
version = "0.9.2"
edition = "2021"

[lib]
name = "garlic_release_cache"

[dependencies]
wasmi = { version = "=2.0.3", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
base64 = "0.22"
garlic-state = { path = "../state" }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking","rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
